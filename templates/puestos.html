<div class="box" style="background:#121212; padding:20px; border:1px solid #333; border-radius:8px">
    <h3 style="color:#D4AF37">Nueva Guardia</h3>
    <input type="hidden" id="p-id">
    <input id="p-nom" placeholder="Nombre Puesto" style="width:30%; padding:10px; background:#000; color:#fff">
    <input id="p-hor" placeholder="Horario" style="width:30%; padding:10px; background:#000; color:#fff">
    <input id="p-dot" type="number" placeholder="Cant. Personal" style="width:20%; padding:10px; background:#000; color:#fff">
    <button onclick="savePuesto()" style="background:#D4AF37; padding:10px; font-weight:bold">CREAR</button>
</div>
<div id="grid-pue" style="display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:20px; margin-top:20px"></div>

<script>
    async function renderPuestos() {
        const [rPer, rPue] = await Promise.all([fetch('/api/personal'), fetch('/api/puestos')]);
        const pers = await rPer.json();
        const pues = await rPue.json();

        document.getElementById('grid-pue').innerHTML = pues.map(p => {
            let slots = "";
            for(let i=0; i<p.dotacion; i++) {
                let opts = `<option value="">-- Vacante --</option>`;
                pers.forEach(pe => {
                    const sel = p.asignados[i] == pe.id ? 'selected' : '';
                    opts += `<option value="${pe.id}" ${sel}>${pe.apellido.toUpperCase()}</option>`;
                });
                slots += `<div style="margin:5px 0"><select id="sel-${p.id}-${i}" style="width:100%; background:#000; color:#fff">${opts}</select></div>`;
            }
            return `<div style="background:#080808; border:1px solid #333; border-top:4px solid #D4AF37; padding:15px">
                <h4>${p.nombre}</h4>
                ${slots}
                <button onclick="confirmBatch(${p.id}, ${p.dotacion})" style="width:100%; background:#1b4332; color:#fff; padding:10px; margin-top:10px">CONFIRMAR</button>
            </div>`;
        }).join('');
    }
    
    // Función requerida por index.html
    window.initSection = renderPuestos;

    async function savePuesto() {
        const d = { nombre: document.getElementById('p-nom').value, horario: document.getElementById('p-hor').value, dotacion: document.getElementById('p-dot').value };
        await fetch('/api/puestos', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(d)});
        renderPuestos();
    }

    async function confirmBatch(pId, dot) {
        const asigs = [];
        for(let i=0; i<dot; i++) asigs.push({slot: i, per_id: document.getElementById(`sel-${pId}-${i}`).value});
        await fetch('/api/asignar_batch', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({puesto_id:pId, asignaciones:asigs})});
        alert("Guardia confirmada");
    }
</script>
